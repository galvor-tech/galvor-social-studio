<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Jakarta;src:url("file:///D:/galvor_linkedin/studio/static/fonts/PlusJakartaSans.ttf");font-weight:200 800}
@font-face{font-family:Inter;src:url("file:///D:/galvor_linkedin/studio/static/fonts/Inter.ttf");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0D0C18}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:radial-gradient(1000px 900px at 1400px 520px, rgba(90,50,190,.30), transparent 70%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 2px,transparent 2px 6px),#0D0C18}
.copy{position:absolute;left:100px;top:0;height:1080px;width:880px;display:flex;flex-direction:column;justify-content:center;z-index:30}
.kicker{display:flex;align-items:center;gap:18px;font-family:Consolas,monospace;font-size:28px;letter-spacing:.24em;color:#A685FF;text-transform:uppercase;margin-bottom:54px}
.kicker img{width:44px;height:44px}
h1{font-family:Jakarta,sans-serif;font-weight:800;font-size:104px;line-height:1.03;letter-spacing:-.03em;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.7)}
h1 .p{color:#A47BFF}
.fs{margin-left:-.07em}
.sub{margin-top:48px;font-family:Inter,sans-serif;font-size:29px;color:#BDB6D6}
.sub b{color:#fff;font-weight:600}
.pol{position:absolute;width:168px;height:206px;background:#EDE9F5;border-radius:6px;padding:10px 10px 38px;box-shadow:0 14px 30px rgba(0,0,0,.55)}
.pol .ph{width:100%;height:100%;border-radius:3px;position:relative;overflow:hidden}
.pol .ph svg{position:absolute;left:50%;bottom:-6px;width:104%;transform:translateX(-50%)}
.pol.dim{filter:grayscale(.85) brightness(.55)}
.pin{position:absolute;left:50%;top:-8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bbb,#555);box-shadow:0 3px 6px rgba(0,0,0,.6)}
.x{position:absolute;inset:-6px;pointer-events:none}
.hero{z-index:20;filter:none;width:230px;height:282px;padding:13px 13px 52px;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 80px rgba(255,190,90,.35)}
.loop{position:absolute;z-index:21;pointer-events:none}
.note{position:absolute;z-index:22;font-family:"Ink Free","Segoe Print","Comic Sans MS",cursive;font-size:62px;color:#FFC955;transform:rotate(-8deg);text-shadow:0 0 4px #0D0C18,0 0 10px #0D0C18,0 0 18px #0D0C18,0 0 26px rgba(255,190,80,.55)}
</style></head>
<body><div class="stage" id="st">
  <div class="copy">
    <div class="kicker"><img src="mark.png" alt="">Decoded by Galvor <span>•</span> Issue #4</div>
    <h1>We Shortlisted<br>20 Creators<span class="fs">.</span><br><span class="p">The Brand<br>Picked One<span class="fs">.</span></span></h1>
    <div class="sub">The story behind <b>Galvor Scout</b>, by Raj Dhakad</div>
  </div>
</div>
<script>
const st=document.getElementById('st');
const sil='<svg viewBox="0 0 100 100"><circle cx="50" cy="38" r="17" fill="rgba(255,255,255,.88)"/><path d="M12 104c0-24 17-38 38-38s38 14 38 38z" fill="rgba(255,255,255,.88)"/></svg>';
function rnd(a){let x=Math.sin(a*999)*10000;return x-Math.floor(x)}
const hues=[262,320,200,25,170,285,345,220,40,150,300,190,10,250,60,330,210,275,120,350];
// 4 rows x 5 cols, jittered; slot 8 is the hero
const cols=5, rows=4, x0=1000, y0=40, dx=180, dy=255;
let n=0;
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const i=r*cols+c; if(i===8){n++;continue;}
  const p=document.createElement('div'); p.className='pol dim';
  const x=x0+c*dx+(rnd(i+1)-.5)*40, y=y0+r*dy+(rnd(i+7)-.5)*36, rot=(rnd(i+3)-.5)*16;
  p.style.cssText=`left:${x}px;top:${y}px;transform:rotate(${rot}deg);z-index:${5+i}`;
  const h=hues[i];
  p.innerHTML=`<div class="pin"></div><div class="ph" style="background:linear-gradient(165deg,hsl(${h} 55% 58%),hsl(${(h+40)%360} 55% 34%))">${sil}</div>
   <svg class="x" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M14 18 Q50 52 88 84" stroke="#E2453C" stroke-width="5.5" fill="none" stroke-linecap="round" opacity=".92"/><path d="M86 16 Q48 50 12 86" stroke="#E2453C" stroke-width="5.5" fill="none" stroke-linecap="round" opacity=".92"/></svg>`;
  st.appendChild(p);
}
// hero polaroid (slot 8 -> row 1, col 3), lifted and bigger
const hx=x0+3*dx-30, hy=y0+1*dy-30;
const h=document.createElement('div'); h.className='pol hero';
h.style.cssText=`left:${hx}px;top:${hy}px;transform:rotate(4deg)`;
h.innerHTML=`<div class="pin"></div><div class="ph" style="background:linear-gradient(165deg,#FFB86B,#F0609E 50%,#7C3AED)">${sil}</div>`;
st.appendChild(h);
// gold marker loop around the hero
const L=document.createElementNS('http://www.w3.org/2000/svg','svg'); L.setAttribute('class','loop');
L.setAttribute('viewBox','0 0 400 440'); L.style.cssText=`left:${hx-82}px;top:${hy-74}px;width:400px;height:440px`;
L.innerHTML='<path d="M200 22 C330 18 392 120 380 230 C368 350 280 420 186 414 C80 408 14 330 22 214 C30 104 110 30 214 34 C250 36 276 46 296 60" fill="none" stroke="#FFC955" stroke-width="9" stroke-linecap="round" style="filter:drop-shadow(0 0 10px rgba(255,190,80,.8))"/>';
st.appendChild(L);
const note=document.createElement('div'); note.className='note'; note.textContent='this one.';
note.style.cssText=`left:${hx+250}px;top:${hy+330}px`; st.appendChild(note);
</script>
</body></html>
